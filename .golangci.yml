version: "2"
linters:
  enable:
    - errorlint
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      # Writing to the CLI stdout/stderr has no useful error to handle.
      - linters: [errcheck]
        text: "fmt.Fprint"
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/rmandevs/agents-casc

name: Pegboard
description: Check in CI that agent configs match pegboard.yaml (drift, plan) and that skills carry no hidden Unicode (audit).
author: rmandevs
branding:
  icon: check-square
  color: gray-dark

inputs:
  command:
    description: >-
      What to run: drift (files edited by hand since the last apply), plan
      (pegboard.yaml declares changes not applied yet), or audit (hidden
      Unicode in skills and context files). Each one fails the job with exit
      code 2 when it finds something.
    default: drift
  args:
    description: Extra arguments, for example "--scope project --strict".
    default: ""
  version:
    description: pegboard version to install, for example v0.2.0 (default latest).
    default: latest
  working-directory:
    description: Directory with pegboard.yaml.
    default: .

outputs:
  exit-code:
    description: 0 if clean, 2 if there is drift, pending changes, or critical findings.
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Install pegboard
      shell: bash
      env:
        PEGBOARD_VERSION: ${{ inputs.version == 'latest' && '' || inputs.version }}
        PEGBOARD_INSTALL_DIR: ${{ runner.temp }}/pegboard-bin
      run: |
        set -euo pipefail
        case "$RUNNER_OS" in
          Linux|macOS) sh "$GITHUB_ACTION_PATH/install.sh" ;;
          *) echo "::error::the pegboard action runs on Linux and macOS runners"; exit 1 ;;
        esac
        echo "$PEGBOARD_INSTALL_DIR" >> "$GITHUB_PATH"

    - name: pegboard ${{ inputs.command }}
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PEGBOARD_COMMAND: ${{ inputs.command }}
        PEGBOARD_ARGS: ${{ inputs.args }}
      run: |
        set -uo pipefail
        case "$PEGBOARD_COMMAND" in
          drift|plan|audit) ;;
          *) echo "::error::command must be drift, plan, or audit (got $PEGBOARD_COMMAND)"; exit 1 ;;
        esac
        # shellcheck disable=SC2086 # args are split on purpose
        pegboard "$PEGBOARD_COMMAND" --exit-code $PEGBOARD_ARGS
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        case "$code" in
          0) ;;
          2) echo "::error::pegboard $PEGBOARD_COMMAND found differences (exit code 2)" ;;
          *) echo "::error::pegboard $PEGBOARD_COMMAND failed (exit code $code)" ;;
        esac
        exit "$code"
